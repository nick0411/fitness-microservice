services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fitness_user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitness-net

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fitness-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fitness-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: [ "start-dev" ]
    ports:
      - "8181:8080"
    networks:
      - fitness-net

  eureka:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=eureka
        - JAVA_VERSION=17
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fitness-net

  configserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=configserver
        - JAVA_VERSION=17
    ports:
      - "8888:8888"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fitness-net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=gateway
        - JAVA_VERSION=23
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - fitness-net

  userservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=userservice
        - JAVA_VERSION=23
    ports:
      - "8081:8081"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fitness_user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - fitness-net

  activityservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=activityservice
        - JAVA_VERSION=23
    ports:
      - "8082:8082"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/fitnessactivity
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - fitness-net

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=aiservice
        - JAVA_VERSION=23
    ports:
      - "8083:8083"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/fitnessrecommendation
      - SPRING_RABBITMQ_HOST=rabbitmq
      - GEMINI_API_URL=${GEMINI_API_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - fitness-net

  # --- FRONTEND ---
  frontend:
    build: ./fitness-app-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - fitness-net

volumes:
  postgres_data:
  mongo_data:

networks:
  fitness-net:
    driver: bridge